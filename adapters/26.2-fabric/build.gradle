plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'java'
}

group = 'cn.wanstu.nosurfacemonsters'
version = project.mod_version

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
}

def localGameRuleApi = file("libs/fabric-game-rule-api-v1-${project.fabric_game_rule_api_version}.jar")

dependencies {
    minecraft 'com.mojang:minecraft:' + project.minecraft_version
    implementation 'net.fabricmc:fabric-loader:' + project.loader_version
    if (localGameRuleApi.isFile()) {
        implementation files(localGameRuleApi)
    } else {
        implementation 'net.fabricmc.fabric-api:fabric-game-rule-api-v1:' + project.fabric_game_rule_api_version
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
base.archivesName = 'no-surface-monsters-26.2-fabric'

sourceSets.main.java.srcDir '../../common/src/main/java'

tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand(version: project.version)
    }
}
