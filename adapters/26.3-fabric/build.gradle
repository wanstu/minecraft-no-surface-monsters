plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.4'
    id 'java'
}
group = 'cn.wanstu.nosurfacemonsters'
version = project.mod_version
repositories { maven { url 'https://maven.fabricmc.net/' }; mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:' + project.minecraft_version
    implementation 'net.fabricmc:fabric-loader:' + project.loader_version
}
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
base.archivesName = 'no-surface-monsters-26.3-fabric'
sourceSets.main.java.srcDir '../../common/src/main/java'
sourceSets.main.java.srcDir '../../v26-common/src/main/java'
sourceSets.main.java.srcDir '../../v26_3-common/src/main/java'
sourceSets.main.resources.srcDir '../../v26-common/src/main/resources'
tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}

apply from: '../../common/verification.gradle'
